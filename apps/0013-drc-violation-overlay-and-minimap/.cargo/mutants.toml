# .cargo/mutants.toml
# Reuse the target directory across scratch builds so mutation runs finish quickly.
copy_target = true

# `update`, `handle_hotkeys`, `render_schematic_bar`, `render_side_panel`,
# `render_active_pin_callout`, `pad_edge_gap_mm`, `detect_pad_clearance_violations`,
# `pads_bounding_box_mm`, and `clamped_minimap_camera_rect` are all mutated & verified!
exclude_re = [
    "replace main",
    "PcbReviewerApp::render_canvas",
    "PcbReviewerApp::paint_board",
    "sample_traces",
    "sample_pads",
    "sample_components",
    "sample_review_pins",
]
