# .cargo/mutants.toml
# Reuse the target directory across scratch builds so mutation runs finish quickly.
copy_target = true

# `update`, `handle_hotkeys`, `render_schematic_bar`, `render_side_panel`, `RulerMeasurement`,
# `ActiveTool`, and all BOM/cross-probe methods are actively mutated and verified!
exclude_re = [
    "replace main",
    "PcbReviewerApp::render_canvas",
    "PcbReviewerApp::paint_board",
    "sample_traces",
    "sample_pads",
    "sample_components",
]
